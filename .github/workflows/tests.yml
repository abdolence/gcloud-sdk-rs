name: tests & formatting
on: 
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo test -p protosgen
      - run: cargo clippy -p gcloud-sdk --all-targets --features id-token-verify,axum,reqwest-middleware -- -Dwarnings
      - run: cargo test -p gcloud-sdk --features id-token-verify,axum,reqwest-middleware
      # These rows build google-cloud-auth without a rustls crypto provider of its own.
      - run: cargo test -p gcloud-sdk --no-default-features --features tls-webpki-roots,id-token-verify
      - run: cargo test -p gcloud-sdk --no-default-features --features tls-roots,jwt-rust-crypto,id-token-verify,axum,reqwest-middleware
