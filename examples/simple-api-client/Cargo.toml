[package]
name = "simple-api-client-example"
version = "0.3.0"
authors = ["me@abdolence.dev"]
edition = "2021"

[dependencies]
gcloud-sdk = { path = "./../../gcloud-sdk", default-features = false, features = ["tls-webpki-roots", "auth-default-crypto", "google-logging-v2"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version ="0.3", features = ["env-filter"] }
rustls = "0.23"
